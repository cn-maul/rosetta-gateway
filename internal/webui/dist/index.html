    <title>Rosetta Gateway · 管理后台</title>
    <!--
      暗色主题防闪。**必须外置、必须是同步脚本**：
      - 外置是因为管理面 CSP 为 script-src 'self'（无 'unsafe-inline'），
        内联 IIFE 会被浏览器静默拦掉，防闪功能直接失效（暗色用户首帧白闪
        回归），而浏览器只在控制台报一条违规，构建与测试全绿；
      - 不能用 type="module"：module 是 defer 语义，等它执行时 CSS 已应用、
        首帧已画完，防闪就没有意义了。
      脚本本体见 public/theme-init.js，逻辑与 src/App.vue 的主题三态一致。
    -->
    <script src="./theme-init.js"></script>
    <script type="module" crossorigin src="./assets/index-BJmalfcG.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-HtQjacnG.css">
  </head>

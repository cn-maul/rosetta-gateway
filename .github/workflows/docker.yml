name: docker

# 只由版本 tag 触发（v1.2.3），外加手动补跑。
# 镜像的版本号直接取自 web/package.json 的 version，与软件本体保持一致；
# 若 tag 与 package.json 不一致，构建会直接失败，避免打出名不副实的镜像。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # 镜像名固定为 rosetta-gateway（GHCR 命名空间用仓库属主）
  IMAGE: ghcr.io/${{ github.repository_owner }}/rosetta-gateway

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 解析版本号（唯一来源：web/package.json）
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./web/package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "软件版本: ${VERSION}"

      - name: 校验 tag 与软件版本一致
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VER="${{ steps.ver.outputs.version }}"
          if [ "${TAG}" != "${VER}" ]; then
            echo "::error::git tag v${TAG} 与 web/package.json 的 ${VER} 不一致"
            exit 1
          fi
          echo "tag 与 package.json 一致: ${VER}"

      # 不装 QEMU：只构建 linux/amd64。setup-qemu-action 装的是 binfmt 模拟器，
# 让 buildx 能「跑」异构架构的构建步骤——本工作流的构建阶段只跑 Go 编译，
# 产出的二进制从不执行，因此 QEMU 是纯开销：拉取约 100MB 模拟器镜像、
# 注册 binfmt_misc 处理器，并让每个 RUN 层的执行都走一层软件模拟。
# 单架构下 buildx 直接在本机执行这些层，反而更快。
      - name: Set up Buildx
        # docker/setup-buildx-action v3.12.0
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: 登录 GHCR
        # docker/login-action v3.7.0
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与 OCI 注解
        id: meta
        # docker/metadata-action v5.10.0
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
          labels: |
            org.opencontainers.image.title=rosetta-gateway
            org.opencontainers.image.description=LLM API gateway: OpenAI Chat Completions in, multi-protocol upstreams out
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 构建并推送
        # docker/build-push-action v6.19.2
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          # 只构建 amd64：部署目标就是 x86_64 服务器，不需要 arm64 镜像。
          # 不写 platforms 时 buildx 默认只构建运行器自身架构，等价于
          # linux/amd64，且省去平台解析与多架构 manifest 的开销。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

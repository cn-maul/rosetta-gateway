name: ci

# 四道检查，全部在 push/PR 时跑：
#
# 1. 仓库卫生：已入库文件里不许出现 exe / db / 密钥 / 数据文件（见 repo-hygiene）。
# 2. go：gofmt / build / vet / 全量测试。历史上 P0 与 P2 阶段各出过一次
#    「只跑 -run TestXxx 让 cmd/gateway 整包红了一轮」的事故 —— 契约改动
#    必须全量跑，这条红绿灯保证它不靠本地自觉。
# 3. 前端类型检查（vue-tsc）。类型全绿证明不了界面正确（见 DESIGN.md），
#    但能拦住字段漂移这类最低级的错。
# 4. 校验「前端产物已同步入库」。
#
# Docker 镜像只是 `COPY . .` + `go build`，用 go:embed 打包仓库里的
# internal/webui/dist —— 它**从不**重新构建前端。于是改完 web/src 却忘了
# `npm run build && node sync-embed.mjs` 就打 tag，旧 UI 会被静默发出去。
# 这里重新构建一遍，若与入库产物不一致即失败 —— 把「忘 sync」
# 从一次线上事故变成一次红灯。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 仓库卫生：已入库文件里不许出现二进制产物 / 数据库 / 密钥 / 运行数据。
  #
  # 为什么值得单列一个 job（而不是塞进 go job 里当一步）：
  #
  # 这类文件一旦进了历史就**擦不掉** —— 删掉当前文件只是让 blob 变成
  # dangling，`git clone` 一样能捞出来（filter-repo / BFG 能改写，但要
  # 强推、要所有协作者重新 clone，代价极高）。本项目历史上真的误推过一次，
  # 所以这里要在「push 之后」立刻发现，而不是等谁本地 `git status` 看见。
  #
  # 为什么用 git ls-files 而不是再检查一遍 .gitignore：
  #   .gitignore 只对**未跟踪**文件生效；已经 add 过的文件即使后来被
  #   写进 .gitignore，git 也照样跟踪它。所以唯一的真相来源是
  #   「索引里到底有什么」，即 git ls-files。ignore 规则管未来，
  #   这个 job 管过去与现在，两层缺一不可。
  #
  # 单独成 job 而不是并进 go job：它只读索引、不装 Go、不跑测试，
  # 几秒钟出结果，可以并行跑；而且它的失败与代码质量无关，
  # 混在一个 job 里会让「红」的原因变得含糊。
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4.4.0。fetch-depth: 0 拉全量历史：本 job 只查索引，
        # 但浅克隆会让 `git ls-files` 报 shallow 相关的边界行为，
        # 全量拉取最稳妥（仓库体量很小，成本可忽略）。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: 检查已入库文件不含产物 / 密钥 / 数据
        run: |
          set -uo pipefail
          # 先把匹配打出来再判失败。只给一句「有文件不该入库」是不够的：
          # 没人知道该去删哪个，而修复动作是 `git rm --cached <file>`，
          # 漏掉文件名就得靠人去猜。
          bad="$(git ls-files \
                  | grep -Ei '\.(exe|dll|so|db|db-shm|db-wal|sqlite|sqlite3|key|pem|crt|log|bak|bak-[0-9].*|oldbak)$' \
                  || true)"
          bad="$bad
          $(git ls-files | grep -Ex 'session_secret(\.oldbak)?' || true)"
          bad="$bad
          $(git ls-files | grep -Ex 'master\.key' || true)"
          bad="$bad
          $(git ls-files | grep -Ex '(admin_auth|config)\.json' || true)"
          bad="$bad
          $(git ls-files | grep -E '^(data|bin|work|tools)/' || true)"

          # 去掉上面若干次 grep 叠出来的空行，只留真正的命中
          bad="$(printf '%s\n' "$bad" | sed '/^$/d' | sort -u)"

          if [ -n "$bad" ]; then
            echo "::error::以下文件已被 git 跟踪，但它们属于构建产物 / 数据库 / 密钥 / 运行数据，绝不应入库："
            printf '%s\n' "$bad" | sed 's/^/    /'
            echo ""
            echo "修复（保留本地文件、只从索引移除）："
            printf '%s\n' "$bad" | sed 's|^|    git rm --cached |'
            echo ""
            echo "若这些文件已在历史里，删当前文件不足以消除泄露："
            echo "    git filter-repo --path <file> --invert-paths"
            echo "  （会重写历史，需要强推，并让所有协作者重新 clone）"
            exit 1
          fi
          echo "已入库文件干净：无 exe / db / 密钥 / 数据文件。"

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        # v4.3.0；版本来自 go.mod（go-version-file），单一来源
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l cmd/ internal/)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未过 gofmt：$unformatted"
            exit 1
          fi

      # 前端的模型/运行时默认值数字来自 Go 单一真源。生成物漂移时页面会
      # 展示一套「推荐值」、后端实际跑另一套，类型检查与构建却都全绿。
      - name: 配置默认值生成物一致
        run: |
          go generate ./internal/config
          git diff --exit-code -- web/src/generated/defaults.ts

      # 前端路由快照从真实 buildApp 导出，而不是从源码正则或手抄清单生成。
      # 注册表改了但忘记同步快照时，这里直接失败。
      - name: 前端路由快照一致
        run: |
          go generate ./cmd/gateway
          git diff --exit-code -- web/src/generated/routes.ts

      # TS 里手写的 DTO 不能靠评审记忆保持同步。Go 侧用 @ts-type 标注的
      # response/request 结构生成字段契约，web tests 再与 types.ts 对账。
      - name: 前端 DTO 契约一致
        run: |
          go generate ./internal/admin
          git diff --exit-code -- web/src/generated/dto-contract.ts

      # 依赖方向是架构约束里最容易在重构中回退的一类：代码能编译、测试也绿，
      # 但 admin 又 import 回 server。单独一步让失败原因一眼可见。
      - name: 架构依赖方向
        run: go test ./internal/architecture -count=1

      - name: Build 与 Vet
        run: |
          go build ./...
          go vet ./...

      # go.sum 的陈旧条目没有别的门禁能发现：go build 不会因为多一行旧版本
      # hash 而失败，于是「升过依赖但 go.sum 没 tidy」会一直悄悄留着，
      # 直到某个工具链在 -mod=readonly 下报错。go mod verify 同样只校验
      # 已下载模块的哈希，与 tidy 是两件事，两个都跑。
      - name: 依赖清单与校验和一致
        run: |
          go mod tidy -diff
          go mod verify

      - name: 全量测试
        # -count=1 禁用缓存：改契约后只跑 -run TestXxx 的老坑（cmd/gateway
        # 整包红一轮）就是这么漏进主干的。
        # ./... 而非手列 ./internal/... ./cmd/gateway/：手列的清单每次新增
        # 命令目录都要记得改这里，漏改就是「整包不进测试范围」且无人察觉。
        #
        # -short 让 perf/leak/stress 这些自带 testing.Short() 守卫的用例跳过
        # （2026-10-21 修 A11-P2-4）。它们跑的是压测与固定 sleep，在共享
        # runner 上是时序敏感的：偶发红很难归因到「性能抖动」还是「真回归」，
        # 于是红色开始贬值。慢测改由 nightly-long 触发，见下。
        run: go test -short -count=1 -timeout 300s ./...

      # 竞态检测单独一轮（2026-10-10 新增）。
      #
      # 为什么值得单列：本仓库的并发密度相对体量偏高 —— 上游凭据冷却、
      # statusResponseWriter 的 statusCode、runtimeReloader 的脏标志，
      # 都是请求 goroutine 与后台 goroutine 共享可变状态。而历史上确实
      # 栽过同类问题（be18edd 上游冷却数据竞争；cooldown_race_test.go
      # 就是那次留下的）。那份测试是**手工构造**的交错，只能证明作者想到的
      # 那一种；没有 -race，就发现不了下一个。
      #
      # 单独一轮而不是并进上面：-race 显著拖慢且需要 CGO 与外部链接器。
      #
      # # 本机（Windows）跑 -race 的正确姿势（2026-10-10 实测）
      #
      # 默认 PATH 上的 MinGW 装在 `C:\Program Files\mingw64`，路径含空格，
      # ld.exe 解析不了（`cannot find C:/Program: No such file or directory`），
      # 于是 `go test -race` 在**链接阶段**就失败。这**不等于本机跑不了** ——
      # 机器上还有一份无空格的 `C:\mingw64\bin\gcc.exe`，显式指定即可：
      #
      #     CC=C:/mingw64/bin/gcc.exe go test -race -count=1 ./...
      #
      # 这个姿势是本轮审计发现的，并且**确实抓出过一条 DATA RACE**
      # （internal/upstream 的冷却测试：测试用私有 mu 写 cred，而生产在
      #  p.mu 下写同一字段 —— 测试侧的竞争，已修）。
      # 所以本机不要因为默认报错就跳过竞态检测；那是环境问题，有解。
      - name: 竞态检测（-race）
        # 同样带 -short：与上面的全量 job 保持同一套用例集，
        # 否则「race 过了但那批用例其实没跑」会变成另一处盲区。
        run: go test -race -short -count=1 -timeout 900s ./...

  # 慢测/压测专用轮次（2026-10-21 修 A11-P2-4）。
  #
  # 为什么单独一个 job 而不是塞回默认流程：这些用例（perf_*.go、
  # perf_leak_test.go、perf_batch_test.go、perf_split_test.go 里的
  # testing.Short() 守卫分支）跑的是吞吐、goroutine 泄漏与并发交叉，
  # 天然依赖机器当时的负载。放在每次 push 的默认门禁里，
  # 一次 runner 抖动就会让主干变红，而人学会的第一件事是忽略红色。
  #
  # 这里用 push 而不是 schedule：慢测必须仍在「改动之后」跑，
  # 推到 main 就触发比等到某个整点更能把回归指回具体的 commit。
  # 没有 -skip：默认 job 已经用 -short 把它们排除了，这里不带 -short
  # 才是「全套用例」。
  nightly-long:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        # 与上面 test job 同一版且同样从 go.mod 取版本（单一来源），
        # 不在这儿另写一个 '1.27.3'：两处写死就会漂移，
        # 而漂移的表现是「同一个 PR 两个 job 用不同工具链」。
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4
        with:
          go-version-file: go.mod
          cache: true

      - name: 慢测 / 压测 / 竞态全量
        # 超时放到 1800s：这一轮刻意包含固定 sleep 与压测，
        # 用 300s 的默认预算砍它是本末倒置。
        run: go test -count=1 -timeout 1800s ./...

      - name: 慢测（-race）
        run: go test -race -count=1 -timeout 1800s ./...

  webui-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        # v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # 显式写 22.12 而不是 '22'（2026-10-15，Vite 5 → 8 迁移）。
          #
          # Vite 8 的 engines 是 `^20.19.0 || >=22.12.0`。'22' 会解析到
          # **当前最新**的 22.x，恰好满足下限 —— 但那是靠浮动侥幸满足的：
          # 哪天有人图省事写成 '22.0' 或某个旧 minor，构建会直接失败，
          # 而且报错来自 npm 的 engines 检查，与被测代码无关，很难一眼归因。
          # 把下限写出来，这条约束就成了配置本身的一部分。
          node-version: '22.12'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 版本号一致性（2026-10-21 修 A11-P2-2）。
      #
      # 版本号有两处副本且读者不同：npm ci 读 package-lock.json，
      # Docker 的版本解析与页脚读 package.json。两边漂移时 Go 侧的内嵌
      # 版本测试（只比 package.json 与 embed 产物）全绿，本 job 的
      # typecheck / test / build 也全绿，直到镜像 tag 与页脚对不上才被发现。
      #
      # 这里用最直白的比较，不引 node 脚本：漂移是提交时就该挡住的事，
      # 不值得为一个两行比较加运行时依赖。
      - name: 版本号与 lockfile 一致
        working-directory: web
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          lockroot=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$pkg" != "$lock" ] || [ "$pkg" != "$lockroot" ]; then
            echo "::error::版本号不一致：package.json=$pkg package-lock.json=$lock packages[\"\"]=$lockroot"
            echo "package.json 是唯一来源；本仓曾经漂移过一次（1.6.5 / 1.6.0）且无任何关卡报错。"
            echo "请以 package.json 的版本号同步 web/package-lock.json 的根 version 与根 packages 条目。"
            exit 1
          fi
          echo "版本号一致：$pkg"

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      # 前端单测此前不在任何 runner 里：tests/routeTrace.test.mjs 有真实断言
      # （转发轨迹解析、单价格式化），但 package.json 没有 test 脚本、
      # 本 job 也不调它 —— 改坏 parseRouteStep 只能等运行时才发现。
      #
      # 这里接进 CI。测试直接 import **.ts 源文件**（src/routeTrace.ts、
      # src/modelPrice.ts），所以跑它必须开类型剥离 —— 否则报
      # ERR_UNKNOWN_FILE_EXTENSION。该能力在 22.6.0 引入、22.18+ 才默认开启，
      # 而本 job 的 Node 固定在 22.12（见上面 setup-node 的注释），恰好落在
      # 「有但默认关」的区间，必须显式加 --experimental-strip-types。
      # 第一版就是漏了它：本地 Node 26 默认开启于是全绿，CI 上直接红。
      # flag 写在 package.json 的 test 脚本里，本地与 CI 走同一条命令。
      - name: 前端单测
        run: npm test

      - name: 构建前端并同步到 go:embed 目录
        run: |
          set -euo pipefail
          npm run build
          node sync-embed.mjs

      - name: 校验入库产物与构建结果一致
        working-directory: .
        run: |
          set -euo pipefail
          # 先把诊断打出来再判失败。只给一句「不一致」是不够的：
          # 跨平台构建的差异往往只有行尾符或某个哈希后缀，常规 diff 一眼看不出来，
          # 而看不到差异就只能在本地反复重跑 build 碰运气。列出具体文件与差异统计，
          # 失败日志就能直接指出「哪几个文件、差多少行」。
          if ! git diff --exit-code --stat -- internal/webui/dist; then
            echo "::group::产物差异明细"
            git diff --numstat -- internal/webui/dist || true
            # 二进制/whitespace-only 差异用普通 diff 看不出来，显式给出忽略空白后的结果：
            # 若下面这行无输出，说明差异**只是空白/行尾符**，而不是真的内容不同。
            echo "--- 忽略空白后的差异（无输出 = 仅行尾符差异）---"
            git diff --ignore-all-space --exit-code --stat -- internal/webui/dist \
              && echo "忽略空白后无差异：问题是行尾符（CRLF/LF）"
            echo "::endgroup::"
            echo "::error::internal/webui/dist 与 web/src 的最新构建不一致。"
            echo "请在本地执行：cd web && npm run build && node sync-embed.mjs，再把同步后的产物一并提交。"
            exit 1
          fi
          echo "入库的前端产物与源码一致。"

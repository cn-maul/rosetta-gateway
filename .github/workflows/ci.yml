name: ci

# 三道检查，全部在 push/PR 时跑：
#
# 1. go：gofmt / build / vet / 全量测试。历史上 P0 与 P2 阶段各出过一次
#    「只跑 -run TestXxx 让 cmd/gateway 整包红了一轮」的事故 —— 契约改动
#    必须全量跑，这条红绿灯保证它不靠本地自觉。
# 2. 前端类型检查（vue-tsc）。类型全绿证明不了界面正确（见 AUDIT-2026-10-06），
#    但能拦住字段漂移这类最低级的错。
# 3. 校验「前端产物已同步入库」。
#
# Docker 镜像只是 `COPY . .` + `go build`，用 go:embed 打包仓库里的
# internal/webui/dist —— 它**从不**重新构建前端。于是改完 web/src 却忘了
# `npm run build && node sync-embed.mjs` 就打 tag，旧 UI 会被静默发出去。
# 这里重新构建一遍，若与入库产物不一致即失败 —— 把「忘 sync」
# 从一次线上事故变成一次红灯。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        # v4.3.0；版本来自 go.mod（go-version-file），单一来源
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l cmd/ internal/)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未过 gofmt：$unformatted"
            exit 1
          fi

      - name: Build 与 Vet
        run: |
          go build ./...
          go vet ./...

      - name: 全量测试
        # -count=1 禁用缓存：改契约后只跑 -run TestXxx 的老坑（cmd/gateway
        # 整包红一轮）就是这么漏进主干的。
        # ./... 而非手列 ./internal/... ./cmd/gateway/：手列的清单每次新增
        # 命令目录都要记得改这里，漏改就是「整包不进测试范围」且无人察觉
        # （cmd/migrate-legacy 就曾不在清单里）。
        run: go test -count=1 -timeout 300s ./...

      # 竞态检测单独一轮（2026-10-10 新增）。
      #
      # 为什么值得单列：本仓库的并发密度相对体量偏高 —— 上游凭据冷却、
      # statusResponseWriter 的 statusCode、runtimeReloader 的脏标志，
      # 都是请求 goroutine 与后台 goroutine 共享可变状态。而历史上确实
      # 栽过同类问题（be18edd 上游冷却数据竞争；cooldown_race_test.go
      # 就是那次留下的）。那份测试是**手工构造**的交错，只能证明作者想到的
      # 那一种；没有 -race，就发现不了下一个。
      #
      # 单独一轮而不是并进上面：-race 显著拖慢且需要 CGO 与外部链接器。
      #
      # # 本机（Windows）跑 -race 的正确姿势（2026-10-10 实测）
      #
      # 默认 PATH 上的 MinGW 装在 `C:\Program Files\mingw64`，路径含空格，
      # ld.exe 解析不了（`cannot find C:/Program: No such file or directory`），
      # 于是 `go test -race` 在**链接阶段**就失败。这**不等于本机跑不了** ——
      # 机器上还有一份无空格的 `C:\mingw64\bin\gcc.exe`，显式指定即可：
      #
      #     CC=C:/mingw64/bin/gcc.exe go test -race -count=1 ./...
      #
      # 这个姿势是本轮审计发现的，并且**确实抓出过一条 DATA RACE**
      # （internal/upstream 的冷却测试：测试用私有 mu 写 cred，而生产在
      #  p.mu 下写同一字段 —— 测试侧的竞争，已修）。
      # 所以本机不要因为默认报错就跳过竞态检测；那是环境问题，有解。
      - name: 竞态检测（-race）
        run: go test -race -count=1 -timeout 900s ./...

  webui-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        # v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建前端并同步到 go:embed 目录
        run: |
          set -euo pipefail
          npm run build
          node sync-embed.mjs

      - name: 校验入库产物与构建结果一致
        working-directory: .
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- internal/webui/dist; then
            echo "::error::internal/webui/dist 与 web/src 的最新构建不一致。"
            echo "请在本地执行：cd web && npm run build && node sync-embed.mjs，再把同步后的产物一并提交。"
            exit 1
          fi
          echo "入库的前端产物与源码一致。"

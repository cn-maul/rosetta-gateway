name: ci

# 四道检查，全部在 push/PR 时跑：
#
# 1. 仓库卫生：已入库文件里不许出现 exe / db / 密钥 / 数据文件（见 repo-hygiene）。
# 2. go：gofmt / build / vet / 全量测试。历史上 P0 与 P2 阶段各出过一次
#    「只跑 -run TestXxx 让 cmd/gateway 整包红了一轮」的事故 —— 契约改动
#    必须全量跑，这条红绿灯保证它不靠本地自觉。
# 3. 前端类型检查（vue-tsc）。类型全绿证明不了界面正确（见 DESIGN.md），
#    但能拦住字段漂移这类最低级的错。
# 4. 校验「前端产物已同步入库」。
#
# Docker 镜像只是 `COPY . .` + `go build`，用 go:embed 打包仓库里的
# internal/webui/dist —— 它**从不**重新构建前端。于是改完 web/src 却忘了
# `npm run build && node sync-embed.mjs` 就打 tag，旧 UI 会被静默发出去。
# 这里重新构建一遍，若与入库产物不一致即失败 —— 把「忘 sync」
# 从一次线上事故变成一次红灯。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 仓库卫生：已入库文件里不许出现二进制产物 / 数据库 / 密钥 / 运行数据。
  #
  # 为什么值得单列一个 job（而不是塞进 go job 里当一步）：
  #
  # 这类文件一旦进了历史就**擦不掉** —— 删掉当前文件只是让 blob 变成
  # dangling，`git clone` 一样能捞出来（filter-repo / BFG 能改写，但要
  # 强推、要所有协作者重新 clone，代价极高）。本项目历史上真的误推过一次，
  # 所以这里要在「push 之后」立刻发现，而不是等谁本地 `git status` 看见。
  #
  # 为什么用 git ls-files 而不是再检查一遍 .gitignore：
  #   .gitignore 只对**未跟踪**文件生效；已经 add 过的文件即使后来被
  #   写进 .gitignore，git 也照样跟踪它。所以唯一的真相来源是
  #   「索引里到底有什么」，即 git ls-files。ignore 规则管未来，
  #   这个 job 管过去与现在，两层缺一不可。
  #
  # 单独成 job 而不是并进 go job：它只读索引、不装 Go、不跑测试，
  # 几秒钟出结果，可以并行跑；而且它的失败与代码质量无关，
  # 混在一个 job 里会让「红」的原因变得含糊。
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4.4.0。fetch-depth: 0 拉全量历史：本 job 只查索引，
        # 但浅克隆会让 `git ls-files` 报 shallow 相关的边界行为，
        # 全量拉取最稳妥（仓库体量很小，成本可忽略）。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: 检查已入库文件不含产物 / 密钥 / 数据
        run: |
          set -uo pipefail
          # 先把匹配打出来再判失败。只给一句「有文件不该入库」是不够的：
          # 没人知道该去删哪个，而修复动作是 `git rm --cached <file>`，
          # 漏掉文件名就得靠人去猜。
          bad="$(git ls-files \
                  | grep -Ei '\.(exe|dll|so|db|db-shm|db-wal|sqlite|sqlite3|key|pem|crt|log|bak|bak-[0-9].*|oldbak)$' \
                  || true)"
          bad="$bad
          $(git ls-files | grep -Ex 'session_secret(\.oldbak)?' || true)"
          bad="$bad
          $(git ls-files | grep -Ex 'master\.key' || true)"
          bad="$bad
          $(git ls-files | grep -Ex '(admin_auth|config)\.json' || true)"
          bad="$bad
          $(git ls-files | grep -E '^(data|bin|work|tools)/' || true)"

          # 去掉上面若干次 grep 叠出来的空行，只留真正的命中
          bad="$(printf '%s\n' "$bad" | sed '/^$/d' | sort -u)"

          if [ -n "$bad" ]; then
            echo "::error::以下文件已被 git 跟踪，但它们属于构建产物 / 数据库 / 密钥 / 运行数据，绝不应入库："
            printf '%s\n' "$bad" | sed 's/^/    /'
            echo ""
            echo "修复（保留本地文件、只从索引移除）："
            printf '%s\n' "$bad" | sed 's|^|    git rm --cached |'
            echo ""
            echo "若这些文件已在历史里，删当前文件不足以消除泄露："
            echo "    git filter-repo --path <file> --invert-paths"
            echo "  （会重写历史，需要强推，并让所有协作者重新 clone）"
            exit 1
          fi
          echo "已入库文件干净：无 exe / db / 密钥 / 数据文件。"

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        # v4.3.0；版本来自 go.mod（go-version-file），单一来源
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l cmd/ internal/)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未过 gofmt：$unformatted"
            exit 1
          fi

      - name: Build 与 Vet
        run: |
          go build ./...
          go vet ./...

      - name: 全量测试
        # -count=1 禁用缓存：改契约后只跑 -run TestXxx 的老坑（cmd/gateway
        # 整包红一轮）就是这么漏进主干的。
        # ./... 而非手列 ./internal/... ./cmd/gateway/：手列的清单每次新增
        # 命令目录都要记得改这里，漏改就是「整包不进测试范围」且无人察觉
        # （cmd/migrate-legacy 就曾不在清单里）。
        run: go test -count=1 -timeout 300s ./...

      # 竞态检测单独一轮（2026-10-10 新增）。
      #
      # 为什么值得单列：本仓库的并发密度相对体量偏高 —— 上游凭据冷却、
      # statusResponseWriter 的 statusCode、runtimeReloader 的脏标志，
      # 都是请求 goroutine 与后台 goroutine 共享可变状态。而历史上确实
      # 栽过同类问题（be18edd 上游冷却数据竞争；cooldown_race_test.go
      # 就是那次留下的）。那份测试是**手工构造**的交错，只能证明作者想到的
      # 那一种；没有 -race，就发现不了下一个。
      #
      # 单独一轮而不是并进上面：-race 显著拖慢且需要 CGO 与外部链接器。
      #
      # # 本机（Windows）跑 -race 的正确姿势（2026-10-10 实测）
      #
      # 默认 PATH 上的 MinGW 装在 `C:\Program Files\mingw64`，路径含空格，
      # ld.exe 解析不了（`cannot find C:/Program: No such file or directory`），
      # 于是 `go test -race` 在**链接阶段**就失败。这**不等于本机跑不了** ——
      # 机器上还有一份无空格的 `C:\mingw64\bin\gcc.exe`，显式指定即可：
      #
      #     CC=C:/mingw64/bin/gcc.exe go test -race -count=1 ./...
      #
      # 这个姿势是本轮审计发现的，并且**确实抓出过一条 DATA RACE**
      # （internal/upstream 的冷却测试：测试用私有 mu 写 cred，而生产在
      #  p.mu 下写同一字段 —— 测试侧的竞争，已修）。
      # 所以本机不要因为默认报错就跳过竞态检测；那是环境问题，有解。
      - name: 竞态检测（-race）
        run: go test -race -count=1 -timeout 900s ./...

  webui-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        # v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # 显式写 22.12 而不是 '22'（2026-10-15，Vite 5 → 8 迁移）。
          #
          # Vite 8 的 engines 是 `^20.19.0 || >=22.12.0`。'22' 会解析到
          # **当前最新**的 22.x，恰好满足下限 —— 但那是靠浮动侥幸满足的：
          # 哪天有人图省事写成 '22.0' 或某个旧 minor，构建会直接失败，
          # 而且报错来自 npm 的 engines 检查，与被测代码无关，很难一眼归因。
          # 把下限写出来，这条约束就成了配置本身的一部分。
          node-version: '22.12'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建前端并同步到 go:embed 目录
        run: |
          set -euo pipefail
          npm run build
          node sync-embed.mjs

      - name: 校验入库产物与构建结果一致
        working-directory: .
        run: |
          set -euo pipefail
          # 先把诊断打出来再判失败。只给一句「不一致」是不够的：
          # 跨平台构建的差异往往只有行尾符或某个哈希后缀，常规 diff 一眼看不出来，
          # 而看不到差异就只能在本地反复重跑 build 碰运气。列出具体文件与差异统计，
          # 失败日志就能直接指出「哪几个文件、差多少行」。
          if ! git diff --exit-code --stat -- internal/webui/dist; then
            echo "::group::产物差异明细"
            git diff --numstat -- internal/webui/dist || true
            # 二进制/whitespace-only 差异用普通 diff 看不出来，显式给出忽略空白后的结果：
            # 若下面这行无输出，说明差异**只是空白/行尾符**，而不是真的内容不同。
            echo "--- 忽略空白后的差异（无输出 = 仅行尾符差异）---"
            git diff --ignore-all-space --exit-code --stat -- internal/webui/dist \
              && echo "忽略空白后无差异：问题是行尾符（CRLF/LF）"
            echo "::endgroup::"
            echo "::error::internal/webui/dist 与 web/src 的最新构建不一致。"
            echo "请在本地执行：cd web && npm run build && node sync-embed.mjs，再把同步后的产物一并提交。"
            exit 1
          fi
          echo "入库的前端产物与源码一致。"
